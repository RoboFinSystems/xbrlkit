name: Create Release & Publish

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version type"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  create-release:
    runs-on: ubuntu-24.04
    # Pushes the version bump to main and creates the release branch. Normally
    # via ACTIONS_TOKEN; github.token is the fallback, so this needs write.
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.new-version.outputs.new_version }}
      branch_name: ${{ steps.new-version.outputs.branch_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # ACTIONS_TOKEN required to push to protected main branch
          token: ${{ secrets.ACTIONS_TOKEN || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Get current version
        id: current-version
        run: |
          CURRENT_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new-version
        run: |
          CURRENT_VERSION="${{ steps.current-version.outputs.current_version }}"
          VERSION_TYPE="${{ inputs.version_type }}"

          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"

          case "$VERSION_TYPE" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          NEW_VERSION="${major}.${minor}.${patch}"
          BRANCH_NAME="release/${NEW_VERSION}"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
          echo "Branch name: $BRANCH_NAME"

      - name: Check if branch already exists
        run: |
          BRANCH_NAME="${{ steps.new-version.outputs.branch_name }}"

          # Check if branch exists locally or remotely
          if git show-ref --verify --quiet refs/heads/$BRANCH_NAME || git show-ref --verify --quiet refs/remotes/origin/$BRANCH_NAME; then
            echo "❌ Branch $BRANCH_NAME already exists"
            exit 1
          else
            echo "✅ Branch $BRANCH_NAME does not exist, proceeding..."
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update main branch version
        run: |
          CURRENT_VERSION="${{ steps.current-version.outputs.current_version }}"
          NEW_VERSION="${{ steps.new-version.outputs.new_version }}"

          echo "Updating main branch version from $CURRENT_VERSION to $NEW_VERSION"

          # Update version in pyproject.toml
          sed -i "s/^version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" pyproject.toml

          # server.json is the Official MCP Registry listing. Clients that install
          # from the registry run exactly the version it pins, so it moves with the
          # package in the same commit; the publish job lists it after the PyPI upload.
          python - "$NEW_VERSION" <<'PY'
          import json
          import sys

          version = sys.argv[1]
          with open("server.json") as f:
            listing = json.load(f)
          listing["version"] = version
          for package in listing["packages"]:
            package["version"] = version
          with open("server.json", "w") as f:
            f.write(json.dumps(listing, indent=2, ensure_ascii=False) + "\n")
          PY

          # Update lock file
          uv sync --all-extras

          # Commit and push to main
          git add pyproject.toml server.json
          git commit -m "Release v$NEW_VERSION"
          git push origin main

      - name: Create release branch
        run: |
          BRANCH_NAME="${{ steps.new-version.outputs.branch_name }}"

          echo "Creating release branch: $BRANCH_NAME"

          # Create new branch from updated main
          git checkout -b "$BRANCH_NAME"

          # Push the release branch
          git push origin "$BRANCH_NAME"

          echo "✅ Release branch created: $BRANCH_NAME"

  create-tag:
    needs: create-release
    permissions:
      contents: write
    uses: RoboFinSystems/robosystems/.github/workflows/tag-release.yml@main
    with:
      branch_ref: ${{ needs.create-release.outputs.branch_name }}
      product_name: 'xbrlkit'
      project_kind: 'Python library'
    secrets: inherit

  # PyPI's trusted publisher is pinned to this workflow file and the production
  # environment. A PyPI version number is burned permanently — it cannot be
  # deleted and re-uploaded, and yanking neither frees the number nor
  # un-distributes what has already been pulled — so the environment's
  # protection rules (required reviewer, deployment branches) gate that
  # irreversible step. The approval prompt lands on this run.
  publish:
    needs: [create-release, create-tag]
    runs-on: ubuntu-24.04
    environment: production

    permissions:
      contents: read
      id-token: write # For PyPI trusted publishing

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.tag_name }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Get current version
        id: current-version
        run: |
          CURRENT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Verify the checkout is the released version
        run: |
          EXPECTED="${{ needs.create-release.outputs.new_version }}"
          ACTUAL="${{ steps.current-version.outputs.current_version }}"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ Checked out version $ACTUAL, expected $EXPECTED"
            exit 1
          fi
          echo "✅ Checked out the released version $ACTUAL"

      # Before anything irreversible: the registry listing must name this version.
      # The create-release job bumps both together; a hand edit could split them.
      - name: Check server.json matches the release
        run: |
          python - <<'PY'
          import json
          import tomllib

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          listing = json.load(open("server.json"))
          versions = {listing["version"], *(p["version"] for p in listing["packages"])}
          if versions != {project["version"]}:
            raise SystemExit(f"server.json pins {sorted(versions)}, pyproject.toml releases {project['version']}")
          if f"mcp-name: {listing['name']}" not in open(project["readme"]).read():
            raise SystemExit(f"README is missing the registry ownership token for {listing['name']}")
          print(f"server.json lists {listing['name']} {project['version']}")
          PY

      # Pinned by version and checksum (the sha256 is the one in the release's
      # registry_1.8.1_checksums.txt), so a new publisher build never runs here
      # unreviewed. Installed outside the checkout, so the build below cannot
      # sweep the binary into the sdist.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mcp-publisher" --version

      # The registry's own validation, which needs no login. Run before the PyPI
      # upload: a version number is burned once uploaded, and a listing the
      # registry rejects could not be published for it afterwards.
      - name: Validate server.json against the registry
        run: mcp-publisher validate server.json

      - name: Build package
        run: python -m build

      # A re-run after the upload succeeded skips the upload and goes on to the
      # registry listing, so a listing failure is recoverable from this run.
      - name: Check if version exists on PyPI
        id: check-pypi
        run: |
          VERSION="${{ steps.current-version.outputs.current_version }}"
          # Read the name from pyproject like the version above, so a rename
          # cannot leave this check pointing at the wrong PyPI project.
          PACKAGE_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")

          # Check if version exists on PyPI
          if curl -s "https://pypi.org/pypi/${PACKAGE_NAME}/${VERSION}/json" | grep -q "\"version\""; then
            echo "Version ${VERSION} is already on PyPI, skipping the upload"
            echo "version_exists=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Version ${VERSION} does not exist on PyPI, safe to publish"
            echo "version_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to PyPI
        if: steps.check-pypi.outputs.version_exists == 'false'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true

      # The Official MCP Registry validates a PyPI listing against the uploaded
      # release (the version must exist and its README must carry the mcp-name
      # token), so wait until PyPI serves it.
      - name: Wait for PyPI to serve the release
        if: steps.check-pypi.outputs.version_exists == 'false'
        run: |
          VERSION="${{ steps.current-version.outputs.current_version }}"
          PACKAGE_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null "https://pypi.org/pypi/${PACKAGE_NAME}/${VERSION}/json"; then
              echo "PyPI serves ${PACKAGE_NAME} ${VERSION}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::PyPI did not serve ${PACKAGE_NAME} ${VERSION} within 5 minutes"
          exit 1

      # Clients that install from the registry run the version it pins, so a
      # release the registry does not list never reaches them. The ai.robosystems
      # namespace is proven by DNS on robosystems.ai; the key is a production
      # environment secret. Skips when this version is already listed, so the
      # listing is published at most once per release, and a re-run after the
      # PyPI upload succeeded still reaches it.
      - name: Publish to the MCP Registry
        env:
          MCP_REGISTRY_DOMAIN: robosystems.ai
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          NAME=$(python -c "import json; print(json.load(open('server.json'))['name'])")
          VERSION=$(python -c "import json; print(json.load(open('server.json'))['version'])")
          ENCODED=$(python -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))" "$NAME")
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/${ENCODED}/versions/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "${NAME} ${VERSION} is already listed"
            exit 0
          fi
          if [ -z "$MCP_REGISTRY_PRIVATE_KEY" ]; then
            echo "::error::MCP_REGISTRY_PRIVATE_KEY is not set on the production environment, so ${NAME} ${VERSION} was not listed"
            exit 1
          fi
          mcp-publisher login dns --domain "$MCP_REGISTRY_DOMAIN" --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          mcp-publisher publish server.json
          echo "Listed ${NAME} ${VERSION} on the Official MCP Registry"

  create-summary:
    needs: [create-release, create-tag, publish]
    if: always()
    runs-on: ubuntu-24.04
    # Writes only to $GITHUB_STEP_SUMMARY, which needs no token scope at all.
    permissions: {}
    steps:
      - name: Create summary
        run: |
          echo "## 🚀 Python Package Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.create-tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ needs.create-tag.outputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ needs.create-release.outputs.branch_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** ${{ inputs.version_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Publish:** ${{ needs.publish.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** ${{ needs.create-tag.outputs.release_url }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.publish.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The version and tag are cut but the release is not on PyPI, or not listed on the MCP Registry. Fix the cause, then **Re-run failed jobs** on this run; a new release is only needed when the code itself is at fault." >> $GITHUB_STEP_SUMMARY
          fi
